<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Assistant Vocal IA - Démo</title>
  <script src="https://unpkg.com/react@18/umd/react.development.js"></script>
  <script src="https://unpkg.com/react-dom@18/umd/react-dom.development.js"></script>
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
  <script src="https://cdn.tailwindcss.com"></script>
  <style>
    .animate-pulse {
      animation: pulse 2s cubic-bezier(0.4, 0, 0.6, 1) infinite;
    }
    .animate-ping {
      animation: ping 1s cubic-bezier(0, 0, 0.2, 1) infinite;
    }
    @keyframes pulse {
      0%, 100% { opacity: 1; }
      50% { opacity: .5; }
    }
    @keyframes ping {
      75%, 100% {
        transform: scale(2);
        opacity: 0;
      }
    }
    
    /* Custom scrollbar */
    .custom-scrollbar::-webkit-scrollbar {
      width: 6px;
    }
    .custom-scrollbar::-webkit-scrollbar-track {
      background: #f1f1f1;
      border-radius: 10px;
    }
    .custom-scrollbar::-webkit-scrollbar-thumb {
      background: #c1c1c1;
      border-radius: 10px;
    }
    .custom-scrollbar::-webkit-scrollbar-thumb:hover {
      background: #a8a8a8;
    }

    /* Dark mode styles */
    @media (prefers-color-scheme: dark) {
      .custom-scrollbar::-webkit-scrollbar-track {
        background: #404040;
      }
      .custom-scrollbar::-webkit-scrollbar-thumb {
        background: #606060;
      }
      .custom-scrollbar::-webkit-scrollbar-thumb:hover {
        background: #808080;
      }
    }
  </style>
</head>
<body class="bg-white dark:bg-gray-900">
  <div id="root"></div>

  <script type="text/babel">
    const { useState, useRef } = React;

    // Utility function
    function cn(...inputs) {
      return inputs.filter(Boolean).join(" ");
    }

    // SVG Icons
    const MicIcon = (props) => (
      <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="1.5" strokeLinecap="round" strokeLinejoin="round" {...props}>
        <path d="M12 1a3 3 0 0 0-3 3v8a3 3 0 0 0 6 0V4a3 3 0 0 0-3-3z"></path>
        <path d="M19 10v2a7 7 0 0 1-14 0v-2"></path>
        <line x1="12" y1="19" x2="12" y2="23"></line>
      </svg>
    );

    const MicOffIcon = (props) => (
      <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="1.5" strokeLinecap="round" strokeLinejoin="round" {...props}>
        <line x1="1" y1="1" x2="23" y2="23"></line>
        <path d="M9 9v3a3 3 0 0 0 5.12 2.12M15 9.34V4a3 3 0 0 0-5.94-.6"></path>
        <path d="M17 16.95A7 7 0 0 1 5 12v-2"></path>
        <line x1="12" y1="19" x2="12" y2="23"></line>
      </svg>
    );

    const Volume2Icon = (props) => (
      <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="1.5" strokeLinecap="round" strokeLinejoin="round" {...props}>
        <polygon points="11 5 6 9 2 9 2 15 6 15 11 19 11 5"></polygon>
        <path d="M19.07 4.93a10 10 0 0 1 0 14.14"></path>
        <path d="M15.54 8.46a5 5 0 0 1 0 7.07"></path>
      </svg>
    );

    const VolumeXIcon = (props) => (
      <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="1.5" strokeLinecap="round" strokeLinejoin="round" {...props}>
        <polygon points="11 5 6 9 2 9 2 15 6 15 11 19 11 5"></polygon>
        <line x1="23" y1="9" x2="17" y2="15"></line>
        <line x1="17" y1="9" x2="23" y2="15"></line>
      </svg>
    );

    const Settings2Icon = (props) => (
      <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="1.5" strokeLinecap="round" strokeLinejoin="round" {...props}>
        <path d="M20 7h-9"></path>
        <path d="M14 17H5"></path>
        <circle cx="17" cy="17" r="3"></circle>
        <circle cx="7" cy="7" r="3"></circle>
      </svg>
    );

    const PlayIcon = (props) => (
      <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="1.5" strokeLinecap="round" strokeLinejoin="round" {...props}>
        <polygon points="5 3 19 12 5 21 5 3"></polygon>
      </svg>
    );

    const VoiceAssistant = () => {
      const [isRecording, setIsRecording] = useState(false);
      const [isPlaying, setIsPlaying] = useState(false);
      const [showSettings, setShowSettings] = useState(false);
      const [messages, setMessages] = useState([]);
      const [recordingTime, setRecordingTime] = useState(0);
      const recordingTimerRef = useRef(null);

      const [settings, setSettings] = useState({
        language: 'fr-FR',
        voiceSpeed: 1.0,
        autoPlayResponse: true,
        noiseCancellation: true,
        voiceActivation: false,
        responseVolume: 0.8
      });

      const handleStartRecording = () => {
        if (isRecording) return;
        
        setIsRecording(true);
        setRecordingTime(0);
        
        // Start recording timer
        recordingTimerRef.current = setInterval(() => {
          setRecordingTime(prev => prev + 0.1);
        }, 100);

        // Simulate recording end after some time or manual stop
        setTimeout(() => {
          if (isRecording) {
            handleStopRecording();
          }
        }, 5000); // Auto stop after 5 seconds
      };

      const handleStopRecording = () => {
        if (!isRecording) return;
        
        setIsRecording(false);
        setRecordingTime(0);
        
        if (recordingTimerRef.current) {
          clearInterval(recordingTimerRef.current);
          recordingTimerRef.current = null;
        }

        // Simulate processing and adding message
        const userMessage = {
          id: Date.now().toString(),
          text: "Message vocal enregistré : \"Bonjour assistant, comment puis-je optimiser mes paramètres vocaux ?\"",
          isUser: true,
          timestamp: new Date(),
          isVoice: true
        };

        setMessages(prev => [...prev, userMessage]);

        // Simulate AI response
        setTimeout(() => {
          const aiResponse = {
            id: (Date.now() + 1).toString(),
            text: `Bonjour ! Pour optimiser vos paramètres vocaux, je recommande d'ajuster la vitesse de parole selon votre préférence, d'activer la réduction de bruit pour un meilleur enregistrement, et de régler le volume des réponses. Vous pouvez aussi activer le mode mains libres si vous le souhaitez.`,
            isUser: false,
            timestamp: new Date(),
            isVoice: true
          };
          setMessages(prev => [...prev, aiResponse]);

          // Auto-play response if enabled
          if (settings.autoPlayResponse) {
            setIsPlaying(true);
            setTimeout(() => setIsPlaying(false), 4000);
          }
        }, 1500);
      };

      const handlePlayMessage = (messageId) => {
        setIsPlaying(true);
        setTimeout(() => setIsPlaying(false), 2000);
      };

      const updateSetting = (key, value) => {
        setSettings(prev => ({ ...prev, [key]: value }));
      };

      const formatTime = (time) => {
        return `${time.toFixed(1)}s`;
      };

      const formatMessageTime = (date) => {
        return date.toLocaleTimeString('fr-FR', { 
          hour: '2-digit', 
          minute: '2-digit' 
        });
      };

      return (
        <div className="flex min-h-screen w-full flex-col items-center justify-center bg-gray-50 dark:bg-gray-900 p-4">
          <div className="w-full max-w-2xl flex flex-col gap-8">
            
            {/* Header */}
            <div className="text-center">
              <h1 className="text-4xl font-bold text-gray-900 dark:text-white mb-2">
                🎤 Assistant Vocal IA
              </h1>
              <p className="text-lg text-gray-600 dark:text-gray-300">
                Parlez avec votre assistant intelligent
              </p>
            </div>

            {/* Messages History */}
            <div className="flex-1 max-h-96 overflow-y-auto px-4 py-4 bg-white dark:bg-gray-800 rounded-2xl shadow-lg custom-scrollbar">
              {messages.length === 0 ? (
                <div className="flex flex-col items-center justify-center h-32 text-center">
                  <MicIcon className="w-12 h-12 text-gray-400 mb-2" />
                  <p className="text-gray-500 dark:text-gray-400">
                    Maintenez le bouton microphone appuyé pour commencer à parler
                  </p>
                </div>
              ) : (
                <div className="space-y-4">
                  {messages.map((message) => (
                    <div
                      key={message.id}
                      className={`flex ${message.isUser ? 'justify-end' : 'justify-start'}`}
                    >
                      <div
                        className={`max-w-md px-4 py-3 rounded-2xl ${
                          message.isUser
                            ? 'bg-blue-600 text-white'
                            : 'bg-gray-100 dark:bg-gray-700 text-gray-900 dark:text-white'
                        }`}
                      >
                        <div className="flex items-start gap-2 mb-2">
                          {message.isVoice && (
                            <button 
                              onClick={() => handlePlayMessage(message.id)}
                              className="mt-0.5 p-1 rounded-full hover:bg-black/10 dark:hover:bg-white/10 transition-colors"
                            >
                              <PlayIcon className="w-3 h-3" />
                            </button>
                          )}
                          <span className="text-sm leading-relaxed">{message.text}</span>
                        </div>
                        <p className={`text-xs ${
                          message.isUser ? 'text-blue-200' : 'text-gray-500 dark:text-gray-400'
                        }`}>
                          {formatMessageTime(message.timestamp)}
                        </p>
                      </div>
                    </div>
                  ))}
                </div>
              )}
            </div>

            {/* Main Voice Interface */}
            <div className="flex flex-col items-center space-y-6 p-8 bg-white dark:bg-gray-800 rounded-[28px] shadow-lg">
              
              {/* Recording Button */}
              <div className="relative">
                <button
                  onMouseDown={handleStartRecording}
                  onMouseUp={handleStopRecording}
                  onTouchStart={handleStartRecording}
                  onTouchEnd={handleStopRecording}
                  className={cn(
                    "w-24 h-24 rounded-full transition-all duration-200 flex items-center justify-center shadow-lg focus:outline-none focus:ring-4",
                    isRecording 
                      ? "bg-red-500 text-white animate-pulse scale-110 focus:ring-red-300" 
                      : "bg-blue-600 hover:bg-blue-700 text-white hover:scale-105 focus:ring-blue-300"
                  )}
                >
                  {isRecording ? (
                    <MicOffIcon className="w-10 h-10" />
                  ) : (
                    <MicIcon className="w-10 h-10" />
                  )}
                </button>
                
                {/* Recording animation ring */}
                {isRecording && (
                  <div className="absolute inset-0 rounded-full border-4 border-red-300 animate-ping"></div>
                )}
              </div>

              {/* Recording Status */}
              <div className="text-center">
                <p className="text-lg font-medium text-gray-900 dark:text-white">
                  {isRecording 
                    ? `🔴 Enregistrement en cours... ${formatTime(recordingTime)}`
                    : settings.voiceActivation 
                    ? "👂 Écoute pour l'activation vocale..."
                    : "👆 Maintenez appuyé pour parler"
                  }
                </p>
                {isPlaying && (
                  <p className="text-sm text-blue-600 dark:text-blue-400 mt-2">
                    🔊 Lecture de la réponse vocale...
                  </p>
                )}
              </div>

              {/* Quick Settings */}
              <div className="flex flex-wrap items-center justify-center gap-3 p-4 bg-gray-50 dark:bg-gray-700 rounded-xl w-full">
                
                {/* Auto-play toggle */}
                <button
                  onClick={() => updateSetting('autoPlayResponse', !settings.autoPlayResponse)}
                  className={cn(
                    "flex items-center gap-2 px-3 py-2 rounded-lg text-sm transition-colors",
                    settings.autoPlayResponse
                      ? "bg-blue-100 dark:bg-blue-900 text-blue-700 dark:text-blue-300"
                      : "bg-gray-200 dark:bg-gray-600 text-gray-600 dark:text-gray-400"
                  )}
                >
                  {settings.autoPlayResponse ? <Volume2Icon className="w-4 h-4" /> : <VolumeXIcon className="w-4 h-4" />}
                  Auto-lecture
                </button>

                {/* Language selector */}
                <select
                  value={settings.language}
                  onChange={(e) => updateSetting('language', e.target.value)}
                  className="px-3 py-2 bg-white dark:bg-gray-600 border border-gray-300 dark:border-gray-600 rounded-lg text-sm text-gray-900 dark:text-white"
                >
                  <option value="fr-FR">🇫🇷 Français</option>
                  <option value="en-US">🇺🇸 English</option>
                  <option value="es-ES">🇪🇸 Español</option>
                  <option value="de-DE">🇩🇪 Deutsch</option>
                </select>

                {/* Settings button */}
                <button
                  onClick={() => setShowSettings(!showSettings)}
                  className="flex items-center gap-2 px-3 py-2 rounded-lg text-sm bg-gray-200 dark:bg-gray-600 text-gray-600 dark:text-gray-400 hover:bg-gray-300 dark:hover:bg-gray-500 transition-colors"
                >
                  <Settings2Icon className="w-4 h-4" />
                  Réglages
                </button>
              </div>
            </div>

            {/* Advanced Settings Panel */}
            {showSettings && (
              <div className="p-6 bg-white dark:bg-gray-800 rounded-2xl shadow-lg space-y-6">
                <h3 className="text-xl font-semibold text-gray-900 dark:text-white">
                  ⚙️ Paramètres avancés
                </h3>

                {/* Voice Speed */}
                <div>
                  <label className="block text-sm font-medium text-gray-700 dark:text-gray-300 mb-2">
                    Vitesse de parole: {settings.voiceSpeed}x
                  </label>
                  <input
                    type="range"
                    min="0.5"
                    max="2"
                    step="0.1"
                    value={settings.voiceSpeed}
                    onChange={(e) => updateSetting('voiceSpeed', parseFloat(e.target.value))}
                    className="w-full h-2 bg-gray-200 dark:bg-gray-600 rounded-lg appearance-none cursor-pointer"
                  />
                  <div className="flex justify-between text-xs text-gray-500 dark:text-gray-400 mt-1">
                    <span>Lent</span>
                    <span>Normal</span>
                    <span>Rapide</span>
                  </div>
                </div>

                {/* Response Volume */}
                <div>
                  <label className="block text-sm font-medium text-gray-700 dark:text-gray-300 mb-2">
                    Volume des réponses: {Math.round(settings.responseVolume * 100)}%
                  </label>
                  <input
                    type="range"
                    min="0"
                    max="1"
                    step="0.1"
                    value={settings.responseVolume}
                    onChange={(e) => updateSetting('responseVolume', parseFloat(e.target.value))}
                    className="w-full h-2 bg-gray-200 dark:bg-gray-600 rounded-lg appearance-none cursor-pointer"
                  />
                </div>

                {/* Toggle Options */}
                <div className="space-y-4">
                  <label className="flex items-center space-x-3">
                    <input
                      type="checkbox"
                      checked={settings.noiseCancellation}
                      onChange={(e) => updateSetting('noiseCancellation', e.target.checked)}
                      className="w-4 h-4 text-blue-600 bg-gray-100 dark:bg-gray-600 border-gray-300 dark:border-gray-600 rounded focus:ring-blue-500"
                    />
                    <span className="text-sm text-gray-700 dark:text-gray-300">
                      🔇 Réduction de bruit avancée
                    </span>
                  </label>

                  <label className="flex items-center space-x-3">
                    <input
                      type="checkbox"
                      checked={settings.voiceActivation}
                      onChange={(e) => updateSetting('voiceActivation', e.target.checked)}
                      className="w-4 h-4 text-blue-600 bg-gray-100 dark:bg-gray-600 border-gray-300 dark:border-gray-600 rounded focus:ring-blue-500"
                    />
                    <span className="text-sm text-gray-700 dark:text-gray-300">
                      🗣️ Activation vocale (mode mains libres)
                    </span>
                  </label>

                  <label className="flex items-center space-x-3">
                    <input
                      type="checkbox"
                      checked={settings.autoPlayResponse}
                      onChange={(e) => updateSetting('autoPlayResponse', e.target.checked)}
                      className="w-4 h-4 text-blue-600 bg-gray-100 dark:bg-gray-600 border-gray-300 dark:border-gray-600 rounded focus:ring-blue-500"
                    />
                    <span className="text-sm text-gray-700 dark:text-gray-300">
                      🔊 Lecture automatique des réponses
                    </span>
                  </label>
                </div>
              </div>
            )}
          </div>
        </div>
      );
    };

    ReactDOM.render(<VoiceAssistant />, document.getElementById('root'));
  </script>
</body>
</html>
